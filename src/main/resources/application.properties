# Application
spring.application.name=lieux-manager
server.port=8080

# H2 Database (embedded - dev)
spring.datasource.url=jdbc:h2:file:./data/lieux_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JWT
auth.token.expirationInMils=604800000
auth.token.refreshExpirationInMils=604800000
auth.token.jwtSecret=09498a01a01fcf4bbc933f04dae23d01b76b140d76bb97be9e0109011766fb0d1b1056370a1978561ae03b29c830511036b954c1d6ea74f6d0710368da35b82c

# File Upload (images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/images

# MVC
spring.mvc.hiddenmethod.filter.enabled=true

# Springdoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# App specific
app.share.base-url=http://localhost:8080
app.location.update-interval-seconds=30
